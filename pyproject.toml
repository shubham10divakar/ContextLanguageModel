[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clm-replication"
version = "0.1.0"
description = "Clean-room replication of Context Language Models (arXiv 2609.37725): context-as-a-file harness, ContextBench, prefix-reuse FLOPs, success-gated RL advantage, skill evolution and Suffix Cache Reuse."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7",
    "pyyaml>=6",
    "numpy>=1.24",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
torch = ["torch>=2.2", "transformers>=4.45"]
dev = ["pytest>=8"]

[project.scripts]
clm = "clm.cli:main"

[tool.setuptools.packages.find]
include = ["clm*"]

[tool.setuptools.package-data]
clm = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
